name: Native API contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out the host JSON parser
        uses: actions/checkout@v4
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3 # 1.7.19, as in ESP-IDF
          path: .host-deps/cjson
          persist-credentials: false
      - name: Check generated SDK and released ABI
        run: python scripts/generate_native_api.py --check
      - name: Check against the previous contract
        env:
          NATIVE_ABI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$NATIVE_ABI_BASE:api/native/abi-lock.json" 2>/dev/null; then
            git show "$NATIVE_ABI_BASE:api/native/abi-lock.json" > "$RUNNER_TEMP/native-api-base.json"
            python scripts/generate_native_api.py --check --baseline "$RUNNER_TEMP/native-api-base.json"
          fi
      - name: Check system service coverage
        run: python scripts/audit_native_system.py --check --require-full
      - name: Test compatibility, optional services, ownership, and unload
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: tests
          CJSON_DIR: ${{ github.workspace }}/.host-deps/cjson
        run: >-
          python -m unittest
          test_native_api_contract test_native_run_scopes test_native_runtime_services test_native_engines
          test_application_scopes test_application_resources test_native_application test_public_application_events test_foreground_app_state
          test_session_display_return test_port_shell_lifecycle test_ssh_session_policy test_native_sessions
          test_pkg_upgrade test_module_requirements test_module_catalog test_pkg_tui test_app_discovery_cache
          test_native_vector test_native_dsp test_script_dsp_bindings test_native_gfx test_display_canvas test_display_rgb_export test_calc_abi test_native_terminal
          test_native_shell_io test_native_expr test_tui_lifecycle test_script_tui_buffering test_native_tui
          test_ui_viewport test_ui_input test_media_dialog test_media_transport_ui test_small_display_apps test_rtsp_app
          test_display_controller_modes test_display_layout_present test_display_scale
          test_display_layer_present test_display_profile_rotation test_display_relax test_display_colors
          test_jet.JetFramebufferTest.test_display_claim_excludes_status_and_restores_terminal
          test_jet.JetFramebufferTest.test_frontend_leases_lua_bindings_and_example
          test_media_playlist test_media_preferences test_photo test_native_m3u test_audio_file_seek test_audio_tones test_audio_pdm
          test_speech_service test_media_service
          test_native_input test_native_input_producers test_native_input_captures test_native_input_callbacks
          test_native_input_composition
          test_native_keymap test_native_input_actions test_input_actions test_script_input_bindings
          test_input_wake test_input_source_ownership test_input_callback_lifetime
          test_system_api_core test_components test_core_flavor test_flavor_config test_flavor_packages test_compiler_packages test_packed_cc_runtime
          test_native_core_api test_native_component_build test_native_queue
          test_shell_frontend_ownership
          test_native_fs_api
          test_native_network_api test_tls_transport test_native_routing_api test_native_wireguard test_native_mqtt
          test_native_http_api test_native_http_lifecycle test_http_policy test_download
          test_native_ble_client test_native_bluetooth test_native_bluetooth_options test_ble_callback_lifetime test_script_ble_bindings test_native_ble_keyboard
          test_ble_discovery test_ble_tui test_tdeck_keyboard test_status_bar_icons
          test_runtime_boundaries test_shutdown_policy test_power_key test_watcher_board test_network_boot
          test_clock_provider_lifetime
          test_docs_metadata_memory
          test_memory_arena test_memory_policy test_task_admission
          test_native_hid_report test_ble_stream test_hid_service test_native_hid_device test_script_hid_bindings
          test_native_ble_stream
          test_native_tcp_stream test_tcp_stream
          test_dlp_stream_client test_display_link
          test_imlib test_emotion
          test_native_remote_api
          test_native_stream_api
          test_agent_images.AgentImagesTest.test_encoded_sources_and_optional_services test_native_vision_services
          test_usb_host_driver test_usb_serial
          test_native_controls_api test_native_motion test_radio_scan_worker
          test_native_io_api
          test_native_bus_api
          test_native_json_api
          test_native_diagnostics_api test_native_xml_api
          test_native_storage_control_api
          test_native_device_api
          test_native_device_providers
          test_external_library_sdk test_sdk_browser
          test_native_api_layout
          test_native_libraries test_native_images test_native_storage test_native_foreground test_native_compiled_foreground
      - name: Test expansion registry and its native ABI
        run: |
          make -C tests/host expansion_registry_test expansion_command_test
          tests/host/expansion_registry_test
          tests/host/expansion_command_test
      - name: Test RTC, schedules and job admission
        run: |
          make -C tests/host rtc_service_test schedule_test jobs_admission_test
          tests/host/rtc_service_test
          tests/host/schedule_test
          tests/host/jobs_admission_test
      - name: Test messaging and Inbox records
        run: |
          make -C tests/host messaging_service_test inbox_saved_history_test chat_settings_test
          tests/host/messaging_service_test
          tests/host/inbox_saved_history_test
          tests/host/chat_settings_test
      - name: Test MIDI wire codec and service
        run: |
          make -C tests/host midi_codec_test midi_service_test
          tests/host/midi_codec_test
          tests/host/midi_service_test

      - name: Test bundled and downloaded manual metadata
        run: |
          make -C tests/host manual_external_metadata_test
          tests/host/manual_external_metadata_test

      - name: Test camera ownership and native video
        run: |
          make -C tests/host camera_service_test native_video_api_test native_video_rtsp_api_test \
            rtsp_client_test rtsp_auth_test rtsp_auth_store_test mjpeg_test
          tests/host/camera_service_test
          tests/host/native_video_api_test
          tests/host/native_video_rtsp_api_test
          tests/host/rtsp_client_test
          tests/host/rtsp_auth_test
          tests/host/rtsp_auth_store_test
          tests/host/mjpeg_test

      - name: Test native USB status and role transitions
        run: |
          make -C tests/host usb_service_test usb_service_no_cdc_test usb_service_storage_test usb_service_vbus_test
          tests/host/usb_service_test
          tests/host/usb_service_no_cdc_test
          tests/host/usb_service_storage_test
          tests/host/usb_service_vbus_test

      - name: Test controller algorithms and shared registry
        run: |
          make -C tests/host controller_math_test controller_tuning_test controllers_test
          tests/host/controller_math_test
          tests/host/controller_tuning_test
          tests/host/controllers_test

      - name: Test GPIO capture and PS/2 ownership
        run: |
          make -C tests/host native_logic_test ps2_bus_test
          tests/host/native_logic_test
          tests/host/ps2_bus_test

      - name: Test shared script lifecycle
        run: |
          make -C tests/host script_lifecycle_test
          tests/host/script_lifecycle_test

      - name: Test document parsing and ABI ownership
        run: |
          make -C tests/host doc_layout_test doc_memory_test doc_list_test native_document_api_test
          tests/host/doc_layout_test
          tests/host/doc_memory_test
          tests/host/doc_list_test
          tests/host/native_document_api_test

      - name: Test shared font packs and glyph ownership
        working-directory: tests/host
        run: |
          make font_packs_test
          ./font_packs_test

      - name: Test storage browser navigation and ownership
        run: |
          make -C tests/host native_storage_browser_test
          tests/host/native_storage_browser_test

  firmware:
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        environment: [freenove_esp32_wrover_v3, seeed_reterminal_sticky, esp32_s3_devkitc1_n16r8, waveshare_esp32_s3_epaper_3_97]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: native-api-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build firmware with generated contract checks
        run: pio run -e "${{ matrix.environment }}"
      - name: Check the compiled foreground host without an ELF backend
        if: matrix.environment == 'freenove_esp32_wrover_v3'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: tests
        run: python -m unittest test_native_compiled_foreground
      - name: Check public SDK with the SolarOS C frontend
        if: matrix.environment == 'esp32_s3_devkitc1_n16r8'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: tests
          NATIVE_ABI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python modules/experimental/tinycc/build.py
          python -m unittest test_native_api_contract.NativeApiContractTest.test_public_sdk_compiles_with_the_solaros_c_frontend test_native_api_layout test_native_component_build test_ui_viewport
          if git cat-file -e "$NATIVE_ABI_BASE:api/native/layout-xtensa.json" 2>/dev/null; then
            git show "$NATIVE_ABI_BASE:api/native/layout-xtensa.json" > "$RUNNER_TEMP/native-layout-base.json"
            python scripts/check_native_layout.py --baseline "$RUNNER_TEMP/native-layout-base.json"
          fi
