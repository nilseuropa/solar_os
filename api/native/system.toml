# Scope is the OS's service interfaces, independently of consumers.
[scope]
packages = ["core_runtime", "service_*"]
exclude_packages = ["service_native_modules", "service_system_api"]
exclude_paths = ["src/vendor/**"]
extra_headers = ["src/shell/solar_os_shell_io.h", "src/services/solar_os_module_packages.h"]

