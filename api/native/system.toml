# Explicitly reviewed core routing hooks, not application ABI operations.

[internal.solar_os_input_init]
reason = "Core boot initializes global routing queues and registries before producers or applications run."
review = "a17f29c613672cd4b1fac853a9c95a12eb4def2c6707ab46b3ec773e4034027d"

[internal.solar_os_input_set_wake_callback]
reason = "Core boot installs the runtime-lifetime wake signal for its event consumer; applications publish through producer handles."
review = "17e63c7e10ed2abe87c6a1759d120746ecc04635f758e0af3693405bbad3232b"

[internal.solar_os_input_set_display_orientation_resolver]
reason = "Core boot connects the display manager to touch routing; applications use coordinate transforms and display services."
review = "61b3e50f9a4a4cb07d64a4dcd673a69274bbdd81aa09d056ac6900fbef6648b3"

[internal.solar_os_input_set_display_size_resolver]
reason = "Core boot connects native display bounds to touch recognition; application producers submit samples without replacing this resolver."
review = "c9f5b45ca8dd593240946f1f178b0ecced04c47fea66917aa6900c72f25a9f87"

[internal.solar_os_input_poll]
reason = "The central runtime pump advances timed input recognition once for all sources; applications receive routed events or captures."
review = "c970e83c739b1850eb78630d57aeffffdb21c14091041f4998fcc2acbe512632"

[internal.solar_os_input_pointer_filter_event]
reason = "The central runtime pump applies the registered filter after orientation; applications register filters rather than replaying this stage."
review = "0e361e8c3c20020006175353012cf7842ad5f1fcc013b2be93fa8786d2725f8b"

[internal.solar_os_input_read_events]
reason = "The central runtime pump drains the global key queue for session routing; application keyboard captures have their own owned read operation."
review = "cd7b35a095de2db165c619f45808ceecae1ce31752754225a4c2e6e89a2c5ca8"

[internal.solar_os_input_read_pointer_events]
reason = "The central runtime pump drains the global pointer queue for display routing; applications receive routed events or use pointer captures."
