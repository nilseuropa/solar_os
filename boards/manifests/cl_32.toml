schema = 1

[board]
id = "cl_32"
name = "CL-32"
vendor = "CL-32"
module = "ESP32-S3-WROOM-1-N16R8"

[target]
mcu = "esp32s3"
platformio_board = "esp32-s3-devkitc1-n16r8"

[build]
drivers = [
  "cdc_usb_serial_jtag",
  "uart_esp_idf",
  "display_st7305",
  "storage_expansion",
  "i2c_esp_idf",
  "spi_esp_idf",
  "rtc_pcf85063",
  "audio_expansion",
  "battery_expansion",
  "gpio_esp_idf",
  "adc_esp_idf",
  "pwm_esp_idf",
]
capabilities = [
  "psram", "simd", "display", "gfx", "cdc", "uart", "sd", "i2c", "spi", "rtc",
  "battery", "wifi", "ble", "audio", "gpio", "adc", "pwm", "expansion_gpio",
  "expansion_i2c", "expansion_spi", "expansion_uart", "expansion_adc",
  "expansion_pwm", "expansion_i2s", "streaming_display",
]
required_packages = []
psram_bytes = 8388608

[defines]
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"ST7305"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "384"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "168"
SOLAR_OS_BOARD_PIN_LCD_CS = "GPIO_NUM_6"
SOLAR_OS_BOARD_PIN_LCD_SCK = "GPIO_NUM_9"
SOLAR_OS_BOARD_PIN_LCD_MOSI = "GPIO_NUM_10"
SOLAR_OS_BOARD_PIN_LCD_RST = "GPIO_NUM_12"
SOLAR_OS_BOARD_PIN_LCD_DC = "GPIO_NUM_13"
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_1"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_2"
SOLAR_OS_BOARD_SPI_HOST = "SPI2_HOST"
SOLAR_OS_BOARD_SPI_NAME = '"FSPI"'
SOLAR_OS_BOARD_PIN_SPI_SCLK = "GPIO_NUM_9"
SOLAR_OS_BOARD_PIN_SPI_MISO = "GPIO_NUM_11"
SOLAR_OS_BOARD_PIN_SPI_MOSI = "GPIO_NUM_10"
SOLAR_OS_BOARD_SPI_MAX_TRANSFER_SZ = "4096"

[runtime]
spi_hosts = ["SPI3_HOST"]
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_1"]

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 1
scl = 2
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI2_HOST"
sclk = 9
miso = 11
mosi = 10
cs = [6, 7]
max_transfer_size = 4096

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[devices]]
driver = "st7305"
name = "display0"
bindings = { spi = "spi0", cs = 6, dc = 13, reset = 12, panel = 1, rotation = 3 }

[[devices]]
driver = "pcf85063"
name = "rtc0"
bindings = { i2c = "i2c0", addr = 0x51 }

[[devices]]
driver = "cl32-core"
name = "core0"
bindings = { i2c = "i2c0", addr = 0x08 }

[[devices]]
driver = "sdspi"
name = "storage0"
bindings = { spi = "spi0", cs = 7 }

[[devices]]
driver = "audio-pwm"
name = "audio0"
bindings = { pwm = 5 }

[connector]
title = "EX1 M.2 add-on and I2C expansion connectors"
view = "schematic contact order; EX1 key gap is between pins 23 and 32; physical orientation unverified"
