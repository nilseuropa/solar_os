schema = 1
extends = "cl32_base"

[board]
id = "cl_32"

[build]
drivers = ["display_st7305"]
capabilities = ["streaming_display"]

[defines]
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"ST7305"'

[[devices]]
driver = "st7305"
name = "display0"
bindings = { spi = "spi0", cs = 6, dc = 13, reset = 12, panel = 1, rotation = 3 }
