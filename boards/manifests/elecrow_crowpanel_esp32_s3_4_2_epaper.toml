schema = 1

[board]
id = "elecrow_crowpanel_esp32_s3_4_2_epaper"
name = "Elecrow CrowPanel ESP32-S3 4.2-inch E-paper"
vendor = "Elecrow"
module = "ESP32-S3-WROOM-1-N8R8"

[target]
mcu = "esp32s3"
platformio_board = "elecrow_crowpanel_esp32_s3_4_2_epaper"

[build]
drivers = [
  "uart_esp_idf",
  "display_ssd1683",
  "storage_expansion",
  "i2c_esp_idf",
  "spi_esp_idf",
  "gpio_esp_idf",
  "adc_esp_idf",
  "pwm_esp_idf",
]
capabilities = [
  "psram", "simd", "display", "gfx", "uart", "sd", "i2c", "spi", "wifi",
  "ble", "gpio", "adc", "pwm", "expansion_gpio", "expansion_i2c",
  "expansion_spi", "expansion_uart", "expansion_adc", "expansion_pwm",
  "expansion_i2s", "key", "buttons", "status_led",
]
required_packages = []
psram_bytes = 8388608

[header]
includes = ["solar_os_buttons.h", "solar_os_keys.h"]

[defines]
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"SSD1683"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "400"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "300"
SOLAR_OS_BOARD_DISPLAY_DEFAULT_ORIENTATION = "90"
SOLAR_OS_BOARD_DISPLAY_SPI_HOST = "SPI2_HOST"
SOLAR_OS_BOARD_PIN_LCD_SCK = "GPIO_NUM_12"
SOLAR_OS_BOARD_PIN_LCD_MOSI = "GPIO_NUM_11"
SOLAR_OS_BOARD_PIN_LCD_RST = "GPIO_NUM_47"
SOLAR_OS_BOARD_PIN_LCD_DC = "GPIO_NUM_46"
SOLAR_OS_BOARD_PIN_LCD_CS = "GPIO_NUM_45"
SOLAR_OS_BOARD_PIN_LCD_BUSY = "GPIO_NUM_48"
SOLAR_OS_BOARD_PIN_LCD_POWER = "GPIO_NUM_7"
SOLAR_OS_BOARD_SPI_HOST = "SPI3_HOST"
SOLAR_OS_BOARD_SPI_NAME = '"SD-SPI"'
SOLAR_OS_BOARD_PIN_SPI_SCLK = "GPIO_NUM_39"
SOLAR_OS_BOARD_PIN_SPI_MISO = "GPIO_NUM_13"
SOLAR_OS_BOARD_PIN_SPI_MOSI = "GPIO_NUM_40"
SOLAR_OS_BOARD_SPI_MAX_TRANSFER_SZ = "4096"
SOLAR_OS_BOARD_SPI_RESOURCE_OWNER = '"board:sdspi"'
SOLAR_OS_BOARD_PIN_SD_CARD_CS = "GPIO_NUM_10"
SOLAR_OS_BOARD_PIN_SD_POWER = "GPIO_NUM_42"
SOLAR_OS_BOARD_SD_POWER_ACTIVE_LEVEL = "1"
SOLAR_OS_BOARD_PIN_STATUS_LED = "GPIO_NUM_41"
SOLAR_OS_BOARD_STATUS_LED_ACTIVE_LEVEL = "1"
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_2"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "0"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_BUTTONS = '{{.pin = GPIO_NUM_1, .name = "EXIT", .key = SOLAR_OS_KEY_APP_EXIT, .active_low = true, .pull = SOLAR_OS_BUTTON_PULL_NONE}, {.pin = GPIO_NUM_6, .name = "ROTARY-DOWN", .key = SOLAR_OS_KEY_DOWN, .active_low = true, .emit_on_release = true, .pull = SOLAR_OS_BUTTON_PULL_NONE}, {.pin = GPIO_NUM_4, .name = "ROTARY-UP", .key = SOLAR_OS_KEY_UP, .active_low = true, .emit_on_release = true, .pull = SOLAR_OS_BUTTON_PULL_NONE}, {.pin = GPIO_NUM_5, .name = "ROTARY-OK", .key = SOLAR_OS_KEY_ENTER, .active_low = true, .emit_on_release = true, .pull = SOLAR_OS_BUTTON_PULL_NONE}}'

[runtime]
spi_hosts = []
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_1"]

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI2_HOST"
sclk = 12
mosi = 11
cs = [45]
max_transfer_size = 4092

[[buses]]
name = "spi1"
protocol = "spi"
sharing = "shared"
host = "SPI3_HOST"
sclk = 39
miso = 13
mosi = 40
cs = [10]
max_transfer_size = 4096

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[devices]]
driver = "ssd1683"
name = "display0"
bindings = { spi = "spi0", cs = 45, dc = 46, reset = 47, busy = 48, power = 7, clock = 10000, panel = 0 }

[[devices]]
driver = "sdspi"
name = "storage0"
bindings = { spi = "spi1", cs = 10 }

[connector]
title = "U5 2x10 GPIO header"
view = "component side; display facing you"
rows = 2
columns = 10

