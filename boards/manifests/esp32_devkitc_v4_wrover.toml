schema = 1

[board]
id = "esp32_devkitc_v4_wrover"
name = "Espressif ESP32-DevKitC V4 (WROVER)"
vendor = "Espressif"
module = "ESP32-WROVER-E"

[target]
mcu = "esp32"
platformio_board = "freenove_esp32_wrover"

[build]
drivers = [
  "uart_esp_idf",
  "i2c_esp_idf",
  "spi_esp_idf",
  "gpio_esp_idf",
  "adc_esp_idf",
  "pwm_esp_idf",
]
capabilities = [
  "psram", "gfx", "uart", "i2c", "spi", "wifi", "ble", "key", "gpio", "adc", "pwm",
  "expansion_gpio", "expansion_i2c", "expansion_spi", "expansion_uart",
  "expansion_adc", "expansion_pwm", "expansion_i2s",
]
required_packages = []
psram_bytes = 8388608

[defines]
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_1"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_3"
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_0"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_21"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_22"
SOLAR_OS_BOARD_SPI_HOST = "SPI3_HOST"
SOLAR_OS_BOARD_SPI_NAME = '"VSPI"'
SOLAR_OS_BOARD_PIN_SPI_SCLK = "GPIO_NUM_18"
SOLAR_OS_BOARD_PIN_SPI_MISO = "GPIO_NUM_19"
SOLAR_OS_BOARD_PIN_SPI_MOSI = "GPIO_NUM_23"
SOLAR_OS_BOARD_SPI_MAX_TRANSFER_SZ = "4096"

[runtime]
spi_hosts = ["SPI2_HOST"]
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_0", "I2S_NUM_1"]

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 21
scl = 22
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI3_HOST"
sclk = 18
miso = 19
mosi = 23
cs = [4, 13, 14, 27, 32]
max_transfer_size = 4096

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 1
rx = 3
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[pins]]
gpio = 0
policy = "fixed"
role = "BOOT/download / KEY"
expansion = true
[[pins]]
gpio = 1
policy = "fixed"
role = "UART TX"
expansion = true
