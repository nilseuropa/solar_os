schema = 1

[board]
id = "esp32_s3_devkitc1_n16r8"
name = "Espressif ESP32-S3-DevKitC-1-N16R8"
vendor = "Espressif"
module = "ESP32-S3-WROOM-1-N16R8"

[target]
mcu = "esp32s3"
platformio_board = "esp32-s3-devkitc1-n16r8"

[build]
drivers = [
  "cdc_usb_serial_jtag",
  "uart_esp_idf",
  "i2c_esp_idf",
  "spi_esp_idf",
  "gpio_esp_idf",
  "adc_esp_idf",
  "pwm_esp_idf",
]
capabilities = [
  "psram", "simd", "gfx", "cdc", "uart", "i2c", "spi", "wifi", "ble",
  "key", "gpio", "adc", "pwm", "expansion_gpio", "expansion_i2c",
  "expansion_spi", "expansion_uart", "expansion_adc", "expansion_pwm",
  "expansion_i2s",
]
required_packages = []
psram_bytes = 8388608

[defines]
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_0"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_8"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_9"
SOLAR_OS_BOARD_SPI_HOST = "SPI2_HOST"
SOLAR_OS_BOARD_SPI_NAME = '"FSPI"'
SOLAR_OS_BOARD_PIN_SPI_SCLK = "GPIO_NUM_12"
SOLAR_OS_BOARD_PIN_SPI_MISO = "GPIO_NUM_13"
SOLAR_OS_BOARD_PIN_SPI_MOSI = "GPIO_NUM_11"
SOLAR_OS_BOARD_SPI_MAX_TRANSFER_SZ = "4096"

[runtime]
spi_hosts = ["SPI3_HOST"]
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_1"]

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 8
scl = 9
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI2_HOST"
sclk = 12
miso = 13
mosi = 11
cs = [4, 10, 5, 6, 7]
max_transfer_size = 4096

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[connector]
title = "J1 / J3 pin headers"
view = "component side; antenna at top, USB connectors at bottom"
rows = 22
columns = 2

