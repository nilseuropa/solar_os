schema = 1

[board]
id = "freenove_esp32_wrover_v3"
name = "Freenove ESP32-WROVER v3.0"
vendor = "Freenove"
module = "ESP32-WROVER-E-N4R8"

[target]
mcu = "esp32"
platformio_board = "freenove_esp32_wrover"

[build]
drivers = [
  "uart_esp_idf",
  "display_cvbs_pal",
  "storage_expansion",
  "i2c_esp_idf",
  "spi_esp_idf",
  "gpio_esp_idf",
  "adc_esp_idf",
  "pwm_esp_idf",
]
capabilities = [
  "psram", "display", "gfx", "uart", "sd", "i2c", "spi", "wifi", "ble",
  "key", "gpio", "adc", "pwm", "expansion_gpio", "expansion_i2c",
  "expansion_spi", "expansion_uart", "expansion_adc", "expansion_pwm",
  "expansion_i2s",
]
required_packages = []
psram_bytes = 8388608

[defines]
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_1"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_3"
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_0"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_PIN_SDMMC_CLK = "GPIO_NUM_14"
SOLAR_OS_BOARD_PIN_SDMMC_CMD = "GPIO_NUM_15"
SOLAR_OS_BOARD_PIN_SDMMC_D0 = "GPIO_NUM_2"
SOLAR_OS_BOARD_PIN_COMPOSITE_VIDEO = "GPIO_NUM_25"
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '(SOLAR_OS_CVBS_MODE_320X200 ? "PAL 312p/50 CVBS safe area" : "PAL 625/50 CVBS")'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "(SOLAR_OS_CVBS_MODE_320X200 ? 320 : 384)"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "(SOLAR_OS_CVBS_MODE_320X200 ? 200 : 288)"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R1"
SOLAR_OS_BOARD_CPU_FLOOR_MHZ = "240U"

[runtime]
spi_hosts = ["SPI2_HOST", "SPI3_HOST"]
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_1"]

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 1
rx = 3
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[devices]]
driver = "cvbs-pal"
name = "display0"
bindings = { i2s = 0, out = 25 }

[[devices]]
driver = "sdmmc"
name = "storage0"
bindings = { clk = 14, cmd = 15, d0 = 2 }

[connector]
title = "Freenove v3.0 side headers"
view = "component side; antenna at top, USB connector at bottom"
rows = 20
columns = 2

