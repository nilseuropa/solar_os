[[pins]]
gpio = 38
policy = "fixed"
role = "SX1262 MOSI"
[[pins]]
gpio = 39
policy = "fixed"
role = "SX1262 SCLK"
[[pins]]
gpio = 40
policy = "fixed"
role = "SX1262 MISO"
[[pins]]
gpio = 41
policy = "fixed"
role = "SX1262 NSS"
[[pins]]
gpio = 42
