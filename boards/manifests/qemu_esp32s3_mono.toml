schema = 1
extends = "qemu_esp32s3"

[board]
id = "qemu_esp32s3_mono"
name = "QEMU ESP32-S3 with 300x400 monochrome display"
vendor = "Espressif"
module = "QEMU esp32s3 machine"

[build]
drivers = ["display_qemu_mono"]
capabilities = ["display"]

[defines]
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"QEMU-MONO"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "300"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "400"
SOLAR_OS_BOARD_DEFAULT_PORT_SHELL = '"uart0"'

[[devices]]
driver = "qemu-mono"
name = "display0"
bindings = {}

[[devices]]
driver = "qemu-input"
name = "input0"
bindings = {}

[[devices]]
driver = "qemu-eth"
name = "eth0"
bindings = {}
