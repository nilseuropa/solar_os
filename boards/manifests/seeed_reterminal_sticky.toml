schema = 1

[board]
id = "seeed_reterminal_sticky"
name = "Seeed Studio reTerminal Sticky"
vendor = "Seeed Studio"
module = "ESP32-S3R8 (32 MB flash / 8 MB PSRAM)"

[target]
mcu = "esp32s3"
platformio_board = "seeed_reterminal_sticky"

[build]
drivers = [
  "uart_esp_idf",
  "display_ssd1677",
  "battery_expansion",
  "audio_expansion",
  "storage_expansion",
  "pointer_gt911",
  "i2c_esp_idf",
  "spi_esp_idf",
  "rtc_pcf8563",
  "sensors_sht40",
  "gpio_esp_idf",
  "pwm_esp_idf",
]
capabilities = [
  "psram", "simd", "display", "gfx", "streaming_display", "uart", "sd", "i2c", "spi",
  "rtc", "battery", "wifi", "ble", "gpio", "key", "buttons", "pointer",
  "temperature", "humidity", "audio", "audio_input", "pwm", "expansion_i2s",
  "expansion_spi", "expansion_uart", "expansion_i2c", "expansion_gpio", "expansion_pwm",
]
required_packages = []
psram_bytes = 8388608

[header]
includes = ["solar_os_buttons.h", "solar_os_keys.h"]

[defines]
SOLAR_OS_BOARD_POWEROFF_PROVIDER = '"board-power"'
SOLAR_OS_BOARD_POWER_LATCH_PINS = '{GPIO_NUM_45, GPIO_NUM_46}'
# Assert the latch and peripheral rails before display or storage access.
SOLAR_OS_BOARD_BOOT_OUTPUTS = '{{.pin = GPIO_NUM_45, .level = 1}, {.pin = GPIO_NUM_46, .level = 1}, {.pin = GPIO_NUM_47, .level = 1}, {.pin = GPIO_NUM_10, .level = 1}, {.pin = GPIO_NUM_42, .level = 1}, {.pin = GPIO_NUM_38, .level = 0}}'
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"SSD1677"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "800"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "480"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "800"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "480"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R0"
SOLAR_OS_BOARD_DISPLAY_DEFAULT_ORIENTATION = "0"
SOLAR_OS_BOARD_DISPLAY_SPI_CLOCK_HZ = "20000000"
SOLAR_OS_BOARD_DISPLAY_SPI_HOST = "SPI2_HOST"
SOLAR_OS_BOARD_PIN_LCD_SCK = "GPIO_NUM_13"
SOLAR_OS_BOARD_PIN_LCD_MOSI = "GPIO_NUM_14"
SOLAR_OS_BOARD_PIN_LCD_CS = "GPIO_NUM_15"
SOLAR_OS_BOARD_PIN_LCD_DC = "GPIO_NUM_16"
SOLAR_OS_BOARD_PIN_LCD_RST = "GPIO_NUM_17"
SOLAR_OS_BOARD_PIN_LCD_BUSY = "GPIO_NUM_18"
SOLAR_OS_BOARD_PIN_LCD_POWER = "GPIO_NUM_47"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_1"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_0"
SOLAR_OS_BOARD_SPI_HOST = "SPI2_HOST"
SOLAR_OS_BOARD_SPI_NAME = '"EPD-SD-SPI"'
SOLAR_OS_BOARD_PIN_SPI_SCLK = "GPIO_NUM_13"
SOLAR_OS_BOARD_PIN_SPI_MISO = "GPIO_NUM_12"
SOLAR_OS_BOARD_PIN_SPI_MOSI = "GPIO_NUM_14"
SOLAR_OS_BOARD_PIN_SD_CARD_CS = "GPIO_NUM_8"
SOLAR_OS_BOARD_PIN_SD_POWER = "GPIO_NUM_10"
SOLAR_OS_BOARD_SD_POWER_ACTIVE_LEVEL = "1"
SOLAR_OS_BOARD_PIN_TOUCH_SDA = "GPIO_NUM_3"
SOLAR_OS_BOARD_PIN_TOUCH_SCL = "GPIO_NUM_2"
SOLAR_OS_BOARD_PIN_TOUCH_INT = "GPIO_NUM_21"
SOLAR_OS_BOARD_PIN_TOUCH_RST = "GPIO_NUM_41"
SOLAR_OS_BOARD_PIN_TOUCH_EN = "GPIO_NUM_42"
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_4"
SOLAR_OS_BOARD_KEY_SHORT_ACTION = "SOLAR_OS_POWER_KEY_ACTION_SLEEP"
SOLAR_OS_BOARD_KEY_LONG_ACTION = "SOLAR_OS_POWER_KEY_ACTION_SHUTDOWN"
SOLAR_OS_BOARD_PIN_BLE_PAIR = "GPIO_NUM_5"
SOLAR_OS_BOARD_PIN_APP_EXIT = "GPIO_NUM_6"
SOLAR_OS_BOARD_BUTTONS = '{{.pin = GPIO_NUM_5, .name = "UP", .key = SOLAR_OS_KEY_UP, .active_low = true, .emit_on_release = true, .pull = SOLAR_OS_BUTTON_PULL_UP, .long_press_ms = 2000}, {.pin = GPIO_NUM_6, .name = "DOWN", .key = SOLAR_OS_KEY_DOWN, .active_low = true, .emit_on_release = true, .pull = SOLAR_OS_BUTTON_PULL_UP, .long_press_ms = 2000}}'
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_PIN_PWR_HOLD = "GPIO_NUM_45"
SOLAR_OS_BOARD_PIN_PWR_LOCK = "GPIO_NUM_46"
SOLAR_OS_BOARD_PIN_CHG_EN = "GPIO_NUM_39"
SOLAR_OS_BOARD_PIN_MIC_CLK = "GPIO_NUM_19"
SOLAR_OS_BOARD_PIN_MIC_DATA = "GPIO_NUM_20"
SOLAR_OS_BOARD_PIN_MIC_EN = "GPIO_NUM_38"
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"

[runtime]
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_0"]


[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 1
scl = 0
speed_hz = "400000"

[[buses]]
name = "i2c1"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_1"
sda = 3
scl = 2
speed_hz = "400000"

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI2_HOST"
sclk = 13
mosi = 14
miso = 12
cs = [15, 8]
max_transfer_size = 4096

[[devices]]
driver = "ssd1677"
name = "display0"
bindings = { spi = "spi0", cs = 15, dc = 16, reset = 17, busy = 18, power = 47, clock = 20000, rotation = 0, panel = 1 }

[[devices]]
driver = "gt911"
name = "touch0"
bindings = { i2c = "i2c1", addr = 0x5d, alt_addr = 0x14, irq = 21, reset = 41, power = 42, active = 1, rotation = 2, swap_xy = 1 }

[[devices]]
driver = "pcf8563"
name = "rtc0"
bindings = { i2c = "i2c0", addr = 0x51 }

[[devices]]
driver = "sht40"
name = "environment0"
bindings = { i2c = "i2c0", addr = 0x44 }

[[devices]]
driver = "bq27220"
name = "battery0"
bindings = { i2c = "i2c0", addr = 0x55 }

[[devices]]
driver = "lsm6ds3tr-c"
name = "imu0"
bindings = { i2c = "i2c0", addr = 0x6a }

[[devices]]
driver = "sdspi"
name = "storage0"
bindings = { spi = "spi0", cs = 8 }

[[devices]]
driver = "audio-pwm"
name = "audio0"
bindings = { pwm = 48 }

[[devices]]
driver = "audio-pdm"
name = "mic0"
bindings = { i2s = 0, clk = 19, din = 20, power = 38, slot = 0 }

[[pins]]
gpio = 0
policy = "fixed"
role = "sensors I2C SCL"
[[pins]]
gpio = 1
policy = "fixed"
role = "sensors I2C SDA"
[[pins]]
gpio = 2
policy = "fixed"
role = "touch SCL"
[[pins]]
gpio = 3
policy = "fixed"
role = "touch SDA"
[[pins]]
gpio = 4
policy = "fixed"
role = "AI / power button"
[[pins]]
gpio = 5
policy = "fixed"
role = "UP button / hold for BLE pairing"
[[pins]]
gpio = 6
policy = "fixed"
role = "DOWN button / hold for app exit"
[[pins]]
gpio = 8
policy = "fixed"
role = "SD CS"
[[pins]]
gpio = 10
policy = "fixed"
role = "SD power enable"
[[pins]]
gpio = 12
policy = "fixed"
role = "SPI MISO / SD"
[[pins]]
gpio = 13
policy = "fixed"
role = "SPI SCK (EPD + SD)"
[[pins]]
gpio = 14
policy = "fixed"
role = "SPI MOSI (EPD + SD)"
[[pins]]
gpio = 15
policy = "fixed"
role = "EPD CS"
[[pins]]
gpio = 16
policy = "fixed"
role = "EPD DC"
[[pins]]
gpio = 17
policy = "fixed"
role = "EPD RST"
[[pins]]
gpio = 18
policy = "fixed"
role = "EPD BUSY"
[[pins]]
gpio = 19
policy = "fixed"
role = "PDM mic CLK"
[[pins]]
gpio = 20
policy = "fixed"
role = "PDM mic DATA"
[[pins]]
gpio = 21
policy = "fixed"
role = "touch INT"
[[pins]]
gpio = 38
policy = "fixed"
role = "mic power enable"
[[pins]]
gpio = 39
policy = "fixed"
role = "charger enable"
[[pins]]
gpio = 41
policy = "fixed"
role = "touch RST"
[[pins]]
gpio = 42
policy = "fixed"
role = "touch power enable"
[[pins]]
gpio = 45
policy = "fixed"
role = "power hold"
[[pins]]
gpio = 46
policy = "fixed"
role = "power lock"
[[pins]]
gpio = 47
policy = "fixed"
role = "EPD power enable"

[[pins]]
gpio = 7
policy = "fixed"
role = "IMU interrupt"

[[pins]]
gpio = 9
policy = "fixed"
role = "RTC interrupt"

[[pins]]
gpio = 43
policy = "fixed"
role = "USB-UART TX"

[[pins]]
gpio = 44
policy = "fixed"
role = "USB-UART RX"

[[pins]]
gpio = 48
policy = "fixed"
role = "buzzer PWM"
