schema = 1

[board]
id = "t_lora_pager"
name = "LilyGO T-LoRa-Pager (SX1262)"
vendor = "LilyGO"
module = "ESP32-S3 (16 MB QSPI flash, 8 MB quad PSRAM)"

[target]
mcu = "esp32s3"
platformio_board = "t_lora_pager"

[build]
drivers = [
  "cdc_usb_serial_jtag",
  "uart_esp_idf",
  "display_st7796",
  "rtc_pcf85063",
  "storage_expansion",
  "audio_es8311_duplex",
  "i2c_esp_idf",
  "spi_esp_idf",
  "gpio_esp_idf",
  "adc_esp_idf",
  "pwm_esp_idf",
]
capabilities = [
  "streaming_display",
  "psram", "simd", "display", "gfx", "display_brightness",
  "cdc", "uart", "sd", "i2c", "spi", "rtc", "audio", "audio_input",
  "wifi", "ble", "gpio", "adc", "pwm", "key", "buttons",
  "expansion_gpio", "expansion_i2c", "expansion_spi", "expansion_uart",
  "expansion_adc", "expansion_pwm", "expansion_i2s",
]
required_packages = []
psram_bytes = 8388608

[header]
includes = ["solar_os_buttons.h", "solar_os_keys.h"]

[defines]
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"ST7796"'
SOLAR_OS_BOARD_DISPLAY_CONTROLLER_ST7796 = "1"
SOLAR_OS_BOARD_DISPLAY_DRIVER_NAME = '"st7796"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "480"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "222"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "222"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "480"
SOLAR_OS_BOARD_DISPLAY_SPI_CLOCK_HZ = "40000000"
SOLAR_OS_BOARD_DISPLAY_MADCTL = "0x48"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R3"
# Best-effort from LilyGO's own per-rotation offset table; this narrow
# 2.33" panel is a cropped window into a wider ST7796 GRAM. Unverified on
# hardware - if the image looks shifted or wrapped, try swapping this with
# ROW_OFFSET (0), or 0/0.
SOLAR_OS_BOARD_DISPLAY_COL_OFFSET = "49"
SOLAR_OS_BOARD_DISPLAY_ROW_OFFSET = "0"
SOLAR_OS_BOARD_PIN_LCD_CS = "GPIO_NUM_38"
SOLAR_OS_BOARD_PIN_LCD_DC = "GPIO_NUM_37"
SOLAR_OS_BOARD_PIN_LCD_BL = "GPIO_NUM_42"
SOLAR_OS_BOARD_PIN_LCD_SCK = "GPIO_NUM_35"
SOLAR_OS_BOARD_PIN_LCD_MOSI = "GPIO_NUM_34"
SOLAR_OS_BOARD_PIN_LCD_RST = "GPIO_NUM_NC"
SOLAR_OS_BOARD_LCD_BACKLIGHT_ACTIVE_LEVEL = "1"
SOLAR_OS_BOARD_LCD_BACKLIGHT_PWM = "0"
# AW9364 single-wire dimmer on the backlight pin: 16 brightness steps.
SOLAR_OS_BOARD_LCD_BACKLIGHT_PULSE_STEPS = "16"
SOLAR_OS_BOARD_SPI_HOST = "SPI2_HOST"
SOLAR_OS_BOARD_SPI_NAME = '"FSPI"'
SOLAR_OS_BOARD_PIN_SPI_SCLK = "GPIO_NUM_35"
SOLAR_OS_BOARD_PIN_SPI_MISO = "GPIO_NUM_33"
SOLAR_OS_BOARD_PIN_SPI_MOSI = "GPIO_NUM_34"
SOLAR_OS_BOARD_SPI_MAX_TRANSFER_SZ = "4096"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_3"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_2"
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_0"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_BUTTONS = '{{.pin = GPIO_NUM_7, .name = "WHEEL-OK", .key = SOLAR_OS_KEY_ENTER, .active_low = true, .emit_on_release = true, .pull = SOLAR_OS_BUTTON_PULL_UP}}'
SOLAR_OS_BOARD_I2S_PORT = "I2S_NUM_0"
SOLAR_OS_BOARD_PIN_I2S_MCLK = "GPIO_NUM_10"
SOLAR_OS_BOARD_PIN_I2S_BCLK = "GPIO_NUM_11"
SOLAR_OS_BOARD_PIN_I2S_WS = "GPIO_NUM_18"
SOLAR_OS_BOARD_PIN_I2S_DIN = "GPIO_NUM_17"
SOLAR_OS_BOARD_PIN_I2S_DOUT = "GPIO_NUM_45"
# The NS4150B amplifier enable is XL9555 P0.1, driven high by tlora-pager-core.
SOLAR_OS_BOARD_PIN_AUDIO_PA = "GPIO_NUM_NC"
SOLAR_OS_BOARD_AUDIO_CODEC_OUT = '"ES8311"'
SOLAR_OS_BOARD_AUDIO_CODEC_IN = '"ES8311"'
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"

[runtime]
spi_hosts = ["SPI3_HOST"]
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_1"]

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI2_HOST"
sclk = 35
miso = 33
mosi = 34
cs = [38, 21, 36]
max_transfer_size = 4096

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 3
scl = 2
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

# core0 (XL9555) must attach before anything it power-gates: keyboard0,
# radio0 and storage0 all sit behind its power/reset rails. It is marked
# `early` in its driver descriptor and listed first here for the same
# reason display0 (also `early`) is listed right after it.
[[devices]]
driver = "tlora-pager-core"
name = "core0"
bindings = { i2c = "i2c0", addr = 0x20 }

[[devices]]
driver = "st7796"
name = "display0"
bindings = { spi = "spi0", cs = 38, dc = 37, bl = 42, active = 1, pwm = 0 }

[[devices]]
driver = "pcf85063"
name = "rtc0"
bindings = { i2c = "i2c0", addr = 0x51, irq = 1 }

[[devices]]
driver = "es8311-duplex"
name = "audio0"
bindings = { i2c = "i2c0", i2s = 0, mclk = 10, bck = 11, ws = 18, din = 17, dout = 45 }

[[devices]]
driver = "sdspi"
name = "storage0"
bindings = { spi = "spi0", cs = 21 }

[[devices]]
driver = "tca8418"
name = "keyboard0"
bindings = { i2c = "i2c0", addr = 0x34, irq = 6 }

[[devices]]
driver = "rotary-encoder"
name = "wheel0"
bindings = { a = 40, b = 41 }

[[devices]]
driver = "sx1262"
name = "radio0"
bindings = { spi = "spi0", cs = 36, busy = 48, reset = 47, irq = 14 }

[connector]
title = "6-pin extension header"
view = "component side, screen facing up; SCL/SDA/MISO/SCK/TX/GND top row, 5V/CE/GPIO9/MOSI/RX/3V3 bottom row"
rows = 2
columns = 6

[[connectors]]
connector = "EXT"
position = 1
row = 0
column = 0
gpio = 2
kind = "gpio"
label = "SCL (shared I2C)"
[[connectors]]
connector = "EXT"
position = 2
row = 0
column = 1
gpio = 3
kind = "gpio"
label = "SDA (shared I2C)"
[[connectors]]
connector = "EXT"
position = 3
row = 0
column = 2
gpio = 33
kind = "gpio"
label = "MISO (shared SPI)"
[[connectors]]
connector = "EXT"
position = 4
row = 0
column = 3
gpio = 35
kind = "gpio"
label = "SCK (shared SPI)"
[[connectors]]
connector = "EXT"
position = 5
row = 0
column = 4
gpio = 43
kind = "gpio"
label = "TX (console UART)"
[[connectors]]
connector = "EXT"
position = 6
row = 0
column = 5
kind = "ground"
label = "GND"
[[connectors]]
connector = "EXT"
position = 7
row = 1
column = 0
kind = "power"
label = "5V"
[[connectors]]
connector = "EXT"
position = 8
row = 1
column = 1
gpio = 9
kind = "gpio"
label = "GPIO9 (free)"
[[connectors]]
connector = "EXT"
position = 9
row = 1
column = 2
gpio = 9
kind = "control"
label = "CE (XL9555 P1.1, not ESP32 GPIO9)"
[[connectors]]
connector = "EXT"
position = 10
row = 1
column = 3
gpio = 34
kind = "gpio"
label = "MOSI (shared SPI)"
[[connectors]]
connector = "EXT"
position = 11
row = 1
column = 4
gpio = 44
kind = "gpio"
label = "RX (console UART)"
[[connectors]]
connector = "EXT"
position = 12
row = 1
column = 5
kind = "power"
label = "3V3"

