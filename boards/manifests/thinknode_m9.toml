schema = 1

[board]
id = "thinknode_m9"
name = "Elecrow ThinkNode M9"
vendor = "Elecrow"
module = "ESP32-S3R8 (16 MB flash, 8 MB octal PSRAM)"

[target]
mcu = "esp32s3"
platformio_board = "thinknode_m9"

[build]
drivers = [
  "uart_esp_idf",
  "display_st7789",
  "rtc_pcf8563",
  "storage_expansion",
  "audio_expansion",
  "battery_adc",
  "i2c_esp_idf",
  "spi_esp_idf",
  "gpio_esp_idf",
  "adc_esp_idf",
  "pwm_esp_idf",
]
capabilities = [
  "streaming_display",
  "psram", "simd", "display", "gfx", "display_brightness",
  "uart", "sd", "i2c", "spi", "rtc", "battery", "audio",
  "wifi", "ble", "gpio", "adc", "pwm",
  "expansion_gpio", "expansion_i2c", "expansion_spi", "expansion_uart",
  "expansion_adc", "expansion_pwm",
]
required_packages = []
psram_bytes = 8388608

[defines]
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"ST7789"'
SOLAR_OS_BOARD_DISPLAY_CONTROLLER_ST7789 = "1"
SOLAR_OS_BOARD_DISPLAY_DRIVER_NAME = '"st7789"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "320"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "240"
# The panel is a portrait 240x320 ST7789. MADCTL 0xB0 (MV|MY|ML) is
# LovyanGFX rotation 3, so the controller's address window is landscape after
# rotation and transfers use the post-rotation geometry.
#
# The BGR bit is deliberately clear. SolarOS packs a pixel red first, so
# setting it told the controller to read our red as blue: on this panel a
# brown road drew blue and blue water drew orange. Nothing showed it until
# the map drew something other than grey, because grey survives the swap.
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "320"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "240"
SOLAR_OS_BOARD_DISPLAY_SPI_CLOCK_HZ = "40000000"
SOLAR_OS_BOARD_DISPLAY_MADCTL = "0xB0"
SOLAR_OS_BOARD_DISPLAY_INVERT_COLOR = "1"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R0"
SOLAR_OS_BOARD_PIN_LCD_CS = "GPIO_NUM_16"
SOLAR_OS_BOARD_PIN_LCD_DC = "GPIO_NUM_15"
SOLAR_OS_BOARD_PIN_LCD_BL = "GPIO_NUM_17"
SOLAR_OS_BOARD_PIN_LCD_RST = "GPIO_NUM_14"
# GPIO18 is the shared VEXT peripheral power rail, active low.
SOLAR_OS_BOARD_PIN_LCD_POWER = "GPIO_NUM_18"
SOLAR_OS_BOARD_LCD_POWER_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_PIN_SD_POWER = "GPIO_NUM_18"
SOLAR_OS_BOARD_SD_POWER_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_LCD_BACKLIGHT_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_LCD_BACKLIGHT_PWM = "1"
SOLAR_OS_BOARD_SPI_HOST = "SPI2_HOST"
SOLAR_OS_BOARD_SPI_NAME = '"FSPI"'
SOLAR_OS_BOARD_PIN_SPI_SCLK = "GPIO_NUM_40"
SOLAR_OS_BOARD_PIN_SPI_MISO = "GPIO_NUM_38"
SOLAR_OS_BOARD_PIN_SPI_MOSI = "GPIO_NUM_47"
SOLAR_OS_BOARD_SPI_MAX_TRANSFER_SZ = "4096"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_20"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_21"
SOLAR_OS_BOARD_PIN_BATTERY_ADC = "GPIO_NUM_13"
SOLAR_OS_BOARD_BATTERY_ADC_DIVIDER_RATIO = "2.0f"
SOLAR_OS_BOARD_TERMINAL_DEFAULT_TEXT_SIZE = "SOLAR_OS_TERMINAL_TEXT_SIZE_16"
# UART0 is the USB console through the CH340K bridge.
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"

[runtime]
spi_hosts = ["SPI3_HOST"]
uart_ports = ["UART_NUM_2"]

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI2_HOST"
sclk = 40
miso = 38
mosi = 47
cs = [16, 48, 39]
max_transfer_size = 4096

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 20
scl = 21
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "i2c1"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_1"
sda = 7
scl = 6
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "shared"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[buses]]
name = "uart1"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_1"
tx = 3
rx = 2
baud_rate = "115200"

[[devices]]
driver = "st7789"
name = "display0"
bindings = { spi = "spi0", cs = 16, dc = 15, reset = 14, bl = 17, power = 18, active = 0, pwm = 1 }

[[devices]]
driver = "sdspi"
name = "storage0"
bindings = { spi = "spi0", cs = 48 }

[[devices]]
driver = "stc8h-keyboard"
name = "keyboard0"
bindings = { i2c = "i2c0", addr = 0x6c, alt_addr = 0x6d, backlight = 46 }

[[devices]]
driver = "pcf8563"
name = "rtc0"
bindings = { i2c = "i2c1", addr = 0x51 }

[[devices]]
driver = "battery-adc"
name = "battery0"
bindings = { adc = 13, divider = 2000 }

[[devices]]
driver = "audio-pwm"
name = "audio0"
bindings = { pwm = 9 }

# Board revision 1.0 drives the GNSS enable rail active-low, so the module
# stays off until powered on. Revision 1.1 is active-high and needs
# `active = 1` here. Some module batches ship at 9600 baud instead of
# 115200, so the alternate baud is probed as well.
[[devices]]
driver = "nmea"
name = "gnss0"
bindings = { uart = "uart1", power = 11, active = 0, alt_baud = 9600 }

