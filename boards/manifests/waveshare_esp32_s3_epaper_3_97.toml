schema = 1

[board]
id = "waveshare_esp32_s3_epaper_3_97"
name = "Waveshare ESP32-S3-ePaper-3.97"
vendor = "Waveshare"
module = "ESP32-S3-WROOM-1-N16R8"

[target]
mcu = "esp32s3"
platformio_board = "waveshare_esp32_s3_epaper_3_97"

[build]
drivers = [
  "cdc_usb_serial_jtag",
  "uart_esp_idf",
  "display_ssd1677",
  "storage_expansion",
  "battery_expansion",
  "i2c_esp_idf",
  "spi_esp_idf",
  "rtc_pcf85063",
  "sensors_shtc3",
  "audio_es8311_duplex",
  "gpio_esp_idf",
]
capabilities = [
  "psram", "simd", "display", "gfx", "cdc", "uart", "sd", "i2c", "spi",
  "rtc", "battery", "audio", "audio_input", "wifi", "ble", "gpio", "expansion_gpio",
  "expansion_i2c", "expansion_uart", "expansion_i2s", "key", "buttons",
  "temperature", "humidity",
]
required_packages = []
psram_bytes = 8388608

[header]
includes = ["solar_os_buttons.h", "solar_os_keys.h"]

[defines]
SOLAR_OS_BOARD_POWEROFF_PROVIDER = '"power0"'
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"SSD1677"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "480"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "800"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "800"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "480"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R3"
SOLAR_OS_BOARD_DISPLAY_DEFAULT_ORIENTATION = "270"
SOLAR_OS_BOARD_DISPLAY_SPI_CLOCK_HZ = "20000000"
SOLAR_OS_BOARD_DISPLAY_SPI_HOST = "SPI3_HOST"
SOLAR_OS_BOARD_PIN_LCD_SCK = "GPIO_NUM_11"
SOLAR_OS_BOARD_PIN_LCD_MOSI = "GPIO_NUM_12"
SOLAR_OS_BOARD_PIN_LCD_CS = "GPIO_NUM_10"
SOLAR_OS_BOARD_PIN_LCD_DC = "GPIO_NUM_9"
SOLAR_OS_BOARD_PIN_LCD_RST = "GPIO_NUM_46"
SOLAR_OS_BOARD_PIN_LCD_BUSY = "GPIO_NUM_3"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_41"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_42"
SOLAR_OS_BOARD_PIN_RTC_INT = "GPIO_NUM_45"
SOLAR_OS_BOARD_PIN_SDMMC_CLK = "GPIO_NUM_16"
SOLAR_OS_BOARD_PIN_SDMMC_CMD = "GPIO_NUM_17"
SOLAR_OS_BOARD_PIN_SDMMC_D0 = "GPIO_NUM_15"
SOLAR_OS_BOARD_PIN_SDMMC_D1 = "GPIO_NUM_7"
SOLAR_OS_BOARD_PIN_SDMMC_D2 = "GPIO_NUM_8"
SOLAR_OS_BOARD_PIN_SDMMC_D3 = "GPIO_NUM_18"
SOLAR_OS_BOARD_I2S_PORT = "I2S_NUM_0"
SOLAR_OS_BOARD_PIN_I2S_MCLK = "GPIO_NUM_13"
SOLAR_OS_BOARD_PIN_I2S_BCLK = "GPIO_NUM_14"
SOLAR_OS_BOARD_PIN_I2S_WS = "GPIO_NUM_47"
SOLAR_OS_BOARD_PIN_I2S_DOUT = "GPIO_NUM_21"
SOLAR_OS_BOARD_PIN_I2S_DIN = "GPIO_NUM_48"
SOLAR_OS_BOARD_PIN_AUDIO_PA = "GPIO_NUM_39"
SOLAR_OS_BOARD_AUDIO_CODEC_OUT = '"ES8311"'
SOLAR_OS_BOARD_AUDIO_CODEC_IN = '"ES8311"'
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_0"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_KEY_SHORT_INPUT_KEY = "SOLAR_OS_KEY_APP_EXIT"
SOLAR_OS_BOARD_BUTTONS = '''{{.pin = GPIO_NUM_4, .name = "ROTARY-UP", .key = SOLAR_OS_KEY_UP, .active_low = true, .emit_on_release = true, .pull = SOLAR_OS_BUTTON_PULL_NONE}, {.pin = GPIO_NUM_6, .name = "ROTARY-DOWN", .key = SOLAR_OS_KEY_DOWN, .active_low = true, .emit_on_release = true, .pull = SOLAR_OS_BUTTON_PULL_NONE}, {.pin = GPIO_NUM_5, .name = "ROTARY-OK", .key = SOLAR_OS_KEY_ENTER, .active_low = true, .emit_on_release = true, .pull = SOLAR_OS_BUTTON_PULL_NONE}}'''
SOLAR_OS_BOARD_TERMINAL_DEFAULT_TEXT_SIZE = "SOLAR_OS_TERMINAL_TEXT_SIZE_16"

[runtime]
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_1"]

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI3_HOST"
sclk = 11
mosi = 12
cs = [10]
max_transfer_size = 4096

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 41
scl = 42
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[devices]]
driver = "axp2101"
name = "power0"
bindings = { i2c = "i2c0", addr = 0x34, input_current = 1500, charge_current = 200, charge_voltage = 4200 }

[[devices]]
driver = "qmi8658"
name = "imu0"
bindings = { i2c = "i2c0", addr = 0x6a }

[[devices]]
driver = "ssd1677"
name = "display0"
bindings = { spi = "spi0", cs = 10, dc = 9, reset = 46, busy = 3, rotation = 3, power_i2c = "i2c0", power_addr = 0x34 }

[[devices]]
driver = "pcf85063"
name = "rtc0"
bindings = { i2c = "i2c0", addr = 0x51, irq = 45 }

[[devices]]
driver = "shtc3"
name = "environment0"
bindings = { i2c = "i2c0", addr = 0x70 }

[[devices]]
driver = "es8311-duplex"
name = "audio0"
bindings = { i2c = "i2c0", i2s = 0, mclk = 13, bck = 14, ws = 47, din = 48, dout = 21, pa = 39 }

[[devices]]
driver = "sdmmc"
name = "storage0"
bindings = { clk = 16, cmd = 17, d0 = 15, d1 = 7, d2 = 8, d3 = 18 }

[[pins]]
gpio = 0
policy = "fixed"
role = "BOOT / app exit key"
[[pins]]
