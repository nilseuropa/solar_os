[connector]
title = "UART / I2C breakout pads"
view = "board silkscreen labels"
rows = 1
columns = 7

[[connectors]]
connector = "PADS"
position = 1
row = 0
column = 0
kind = "power"
label = "5V"
[[connectors]]
connector = "PADS"
position = 2
row = 0
column = 1
kind = "ground"
label = "GND"
[[connectors]]
connector = "PADS"
position = 3
