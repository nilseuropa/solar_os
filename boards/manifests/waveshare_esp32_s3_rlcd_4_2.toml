schema = 1

[board]
id = "waveshare_esp32_s3_rlcd_4_2"
name = "Waveshare ESP32-S3-RLCD-4.2"
vendor = "Waveshare"
module = "ESP32-S3-WROOM-1-N16R8"

[target]
mcu = "esp32s3"
platformio_board = "waveshare_esp32_s3_rlcd_4_2"

[build]
drivers = [
  "cdc_usb_serial_jtag",
  "uart_esp_idf",
  "display_st7305",
  "storage_expansion",
  "i2c_esp_idf",
  "spi_esp_idf",
  "rtc_pcf85063",
  "sensors_shtc3",
  "audio_es8311_es7210",
  "gpio_esp_idf",
  "adc_esp_idf",
  "battery_adc",
  "pwm_esp_idf",
]
capabilities = [
  "psram", "simd", "display", "gfx", "cdc", "uart", "sd", "i2c",
  "spi", "rtc", "battery", "audio", "audio_input", "wifi", "ble",
  "gpio", "adc", "pwm", "expansion_gpio", "expansion_i2c",
  "expansion_spi", "expansion_uart", "expansion_adc", "expansion_pwm",
  "expansion_i2s", "key", "temperature", "humidity",
]
required_packages = []
psram_bytes = 8388608

