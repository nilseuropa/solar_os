[runtime]
spi_hosts = ["SPI3_HOST"]
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_1"]

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI2_HOST"
sclk = 11
mosi = 12
cs = [40]
max_transfer_size = 4092

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 13
scl = 14
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[devices]]
driver = "st7305"
name = "display0"
bindings = { spi = "spi0", cs = 40, dc = 5, reset = 41 }

[[devices]]
driver = "pcf85063"
name = "rtc0"
bindings = { i2c = "i2c0", addr = 0x51 }

[[devices]]
driver = "shtc3"
name = "environment0"
bindings = { i2c = "i2c0", addr = 0x70 }

[[devices]]
driver = "battery-adc"
name = "battery0"
bindings = { adc = 4, divider = 3000 }

[[devices]]
driver = "es8311-es7210"
name = "audio0"
bindings = { i2c = "i2c0", i2s = 0, mclk = 16, bck = 9, ws = 45, din = 10, dout = 8, pa = 46 }

[[devices]]
driver = "sdmmc"
name = "storage0"
bindings = { clk = 38, cmd = 21, d0 = 39 }

[connector]
title = "2x8 expansion header"
view = "component side; display facing you"
rows = 2
columns = 8

