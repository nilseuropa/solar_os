schema = 1

[board]
id = "waveshare_esp32_s3_sim7670g_4g"
name = "Waveshare ESP32-S3-SIM7670G-4G V2.0"
vendor = "Waveshare"
module = "ESP32-S3R8 with 16 MB external flash"

[target]
mcu = "esp32s3"
platformio_board = "esp32-s3-devkitc1-n16r8"

[build]
drivers = [
  "uart_esp_idf",
  "storage_expansion",
  "battery_expansion",
  "i2c_esp_idf",
  "spi_esp_idf",
  "gpio_esp_idf",
  "adc_esp_idf",
  "pwm_esp_idf",
]
capabilities = [
  "psram", "simd", "gfx", "uart", "sd", "i2c", "spi", "battery", "wifi", "ble",
  "key", "gpio", "adc", "pwm", "expansion_gpio", "expansion_i2c",
  "expansion_spi", "expansion_uart", "expansion_adc", "expansion_pwm",
  "expansion_i2s",
]
required_packages = []
psram_bytes = 8388608

[defines]
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_0"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_15"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_16"
SOLAR_OS_BOARD_PIN_SDMMC_CLK = "GPIO_NUM_5"
SOLAR_OS_BOARD_PIN_SDMMC_CMD = "GPIO_NUM_4"
SOLAR_OS_BOARD_PIN_SDMMC_D0 = "GPIO_NUM_6"

[runtime]
spi_hosts = ["SPI2_HOST", "SPI3_HOST"]
uart_ports = ["UART_NUM_2"]
i2s_ports = ["I2S_NUM_1"]

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 15
scl = 16
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[buses]]
name = "modem-uart"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_1"
tx = 18
rx = 17
baud_rate = "115200"

[[devices]]
driver = "sdmmc"
name = "storage0"
bindings = { clk = 5, cmd = 4, d0 = 6 }

[[devices]]
driver = "max17048"
name = "battery0"
bindings = { i2c = "i2c0", addr = 0x36 }

[[devices]]
driver = "neopixel"
name = "pixels0"
bindings = { data = 38, count = 1 }

[[devices]]
driver = "sim7670"
name = "modem0"
bindings = { uart = "modem-uart" }

[connector]
title = "P3 / P2 side headers"
view = "battery-holder side; DIP switch at top"
rows = 19
columns = 2

