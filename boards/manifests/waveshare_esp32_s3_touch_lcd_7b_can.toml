# Wiring and RGB timings: Waveshare ESP32-S3-Touch-LCD-7B schematic and
# ESP-IDF examples, vendor commit c652c902db607f7ffb376257393cfd7657aa6428.
# This profile selects CAN. The default USB profile inherits the common wiring.
schema = 1

[board]
id = "waveshare_esp32_s3_touch_lcd_7b_can"
name = "Waveshare ESP32-S3-Touch-LCD-7B (CAN)"
vendor = "Waveshare"
module = "ESP32-S3-WROOM-1-N16R8"

[target]
mcu = "esp32s3"
platformio_board = "waveshare_esp32_s3_touch_lcd_7b"

[build]
drivers = ["uart_esp_idf", "display_rgb", "pointer_gt911", "storage_expansion", "battery_expansion", "i2c_esp_idf", "gpio_esp_idf"]
capabilities = ["psram", "simd", "display", "gfx", "display_brightness", "streaming_display", "pointer", "uart", "sd", "i2c", "battery", "wifi", "ble", "key", "gpio", "expansion_gpio", "expansion_i2c", "expansion_uart"]
required_packages = []
psram_bytes = 8388608

[defines]
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_6"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"ST7262"'
SOLAR_OS_BOARD_DISPLAY_DRIVER_NAME = '"rgb-lcd"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "1024"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "600"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "1024"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "600"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R0"
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_8"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_9"
SOLAR_OS_BOARD_PIN_TOUCH_INT = "GPIO_NUM_4"
SOLAR_OS_BOARD_PIN_SDMMC_CLK = "GPIO_NUM_12"
SOLAR_OS_BOARD_PIN_SDMMC_CMD = "GPIO_NUM_11"
SOLAR_OS_BOARD_PIN_SDMMC_D0 = "GPIO_NUM_13"

[runtime]
uart_ports = ["UART_NUM_2"]

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 8
scl = 9
speed_hz = 400000

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[buses]]
name = "uart1"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_1"
tx = 16
rx = 15
baud_rate = 115200

[[devices]]
driver = "waveshare-io"
name = "io0"
# EXIO1 touch reset, EXIO2 backlight enable, EXIO3 panel reset,
# EXIO4 SD D3 (held high for 1-bit SDMMC), EXIO5 USB/CAN, EXIO6 panel power.
# Outputs are preloaded before enabling lines 1..6. Bit 5 selects CAN.
bindings = { i2c = "i2c0", addr = 0x24, output = 187, direction = 126, battery = 1, backlight = 1, vref = 3300, divider = 3000 }

[[devices]]
driver = "sdmmc"
name = "storage0"
bindings = { clk = 12, cmd = 11, d0 = 13 }

[[devices]]
driver = "rgb-lcd"
name = "display0"
bindings = { d0 = 14, d1 = 38, d2 = 18, d3 = 17, d4 = 10, d5 = 39, d6 = 0, d7 = 45, d8 = 48, d9 = 47, d10 = 21, d11 = 1, d12 = 2, d13 = 42, d14 = 41, d15 = 40, hsync = 46, vsync = 3, de = 5, clk = 7, width = 1024, height = 600, clock = 30000, hsw = 162, hbp = 152, hfp = 48, vsw = 45, vbp = 13, vfp = 3, flags = 8, reset = "io0:3", power = "io0:6", bl = "io0:2" }

[[devices]]
driver = "gt911"
name = "touch0"
bindings = { i2c = "i2c0", addr = 0x5d, alt_addr = 0x14, irq = 4, reset = "io0:1", rotation = 0 }

[[devices]]
driver = "twai-can"
name = "can0"
bindings = { tx = 20, rx = 19, bitrate = 500, listen = 0, select = "io0:5" }

