schema = 1

[board]
id = "xteink_x4_pro"
name = "Xteink X4 Pro"
vendor = "Xteink"
module = "ESP32-S3 with 8 MB OPI PSRAM"

[target]
mcu = "esp32s3"
platformio_board = "xteink_x4_pro"

[build]
drivers = [
  "cdc_usb_serial_jtag", "uart_esp_idf", "display_x4pro", "storage_expansion",
  "battery_expansion", "i2c_esp_idf", "spi_esp_idf", "rtc_pcf8563",
  "pointer_gt911", "gpio_esp_idf",
]
capabilities = [
  "psram", "simd", "display", "display_brightness", "gfx", "cdc", "usb_host", "uart",
  "sd", "i2c", "spi", "rtc", "battery", "pointer", "wifi", "ble", "gpio",
  "expansion_gpio", "expansion_i2c", "expansion_spi", "key", "buttons",
]
required_packages = []
psram_bytes = 8388608

[header]
includes = ["solar_os_buttons.h", "solar_os_keys.h"]

[defines]
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"SSD1677/UC8179/UC8279"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "800"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "480"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "800"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "480"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R0"
SOLAR_OS_BOARD_DISPLAY_DEFAULT_ORIENTATION = "0"
SOLAR_OS_BOARD_DISPLAY_SPI_CLOCK_HZ = "10000000"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_39"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_38"
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_3"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
SOLAR_OS_BOARD_KEY_SHORT_INPUT_KEY = "SOLAR_OS_KEY_APP_EXIT"
SOLAR_OS_BOARD_BUTTONS = '''{{.pin = GPIO_NUM_0, .name = "LEFT", .key = SOLAR_OS_KEY_UP, .active_low = true, .pull = SOLAR_OS_BUTTON_PULL_UP}, {.pin = GPIO_NUM_7, .name = "RIGHT", .key = SOLAR_OS_KEY_DOWN, .active_low = true, .pull = SOLAR_OS_BUTTON_PULL_UP}}'''
SOLAR_OS_BOARD_TERMINAL_DEFAULT_TEXT_SIZE = "SOLAR_OS_TERMINAL_TEXT_SIZE_16"

[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI2_HOST"
sclk = 12
mosi = 11
cs = [13]
max_transfer_size = 4096

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 39
scl = 38
speed_hz = "400000"

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

# This early attachment asserts the shared peripheral latch before storage/touch.
[[devices]]
driver = "x4pro"
name = "display0"
bindings = { spi = "spi0", cs = 13, dc = 18, reset = 14, busy = 6, latch = 1, cool = 8, warm = 9 }

[[devices]]
driver = "sdmmc"
name = "storage0"
bindings = { clk = 41, cmd = 42, d0 = 40, power = 5, active = 0 }

[[devices]]
driver = "gt911"
name = "touch0"
bindings = { i2c = "i2c0", addr = 0x5d, alt_addr = 0x14, irq = 10, reset = 4, power = 2, active = 0, rotation = 1, home_key = 0x92 }

[[devices]]
driver = "pcf8563"
name = "rtc0"
bindings = { i2c = "i2c0", addr = 0x51 }

[[devices]]
driver = "cw2017"
name = "battery0"
bindings = { i2c = "i2c0", addr = 0x63 }

[[pins]]
gpio = 0
policy = "fixed"
role = "left navigation / boot strap"
[[pins]]
gpio = 1
policy = "fixed"
role = "peripheral rail latch (active high)"
[[pins]]
gpio = 2
policy = "fixed"
role = "touch power (active low)"
[[pins]]
gpio = 3
policy = "fixed"
role = "power / system key"
[[pins]]
gpio = 4
policy = "fixed"
role = "touch reset"
[[pins]]
gpio = 5
policy = "fixed"
role = "SD power (active low)"
[[pins]]
gpio = 6
policy = "fixed"
role = "e-paper BUSY"
[[pins]]
gpio = 7
policy = "fixed"
role = "right navigation"
[[pins]]
gpio = 8
policy = "fixed"
role = "cool frontlight PWM"
[[pins]]
gpio = 9
policy = "fixed"
role = "warm frontlight PWM"
[[pins]]
gpio = 10
policy = "fixed"
role = "touch interrupt / address select"
[[pins]]
gpio = 11
policy = "fixed"
role = "e-paper MOSI / identification SDA"
[[pins]]
gpio = 12
policy = "fixed"
role = "e-paper SCK"
[[pins]]
gpio = 13
policy = "fixed"
role = "e-paper CS"
[[pins]]
gpio = 14
policy = "fixed"
role = "e-paper reset"
[[pins]]
gpio = 18
policy = "fixed"
role = "e-paper D/C"
[[pins]]
gpio = 19
policy = "fixed"
role = "USB D-/CDC or host"
[[pins]]
gpio = 20
policy = "fixed"
role = "USB D+/CDC or host"
[[pins]]
gpio = 21
policy = "fixed"
role = "charger STAT (active high)"
[[pins]]
gpio = 38
policy = "fixed"
role = "shared I2C SCL"
[[pins]]
gpio = 39
policy = "fixed"
role = "shared I2C SDA"
[[pins]]
gpio = 40
policy = "fixed"
role = "SDMMC D0"
[[pins]]
gpio = 41
policy = "fixed"
role = "SDMMC CLK"
[[pins]]
gpio = 42
policy = "fixed"
role = "SDMMC CMD"
[[pins]]
gpio = 43
policy = "fixed"
role = "UART0 TX"
[[pins]]
gpio = 44
policy = "fixed"
role = "UART0 RX"
