[flavor]
name = "rover-gameboy"
description = "Focused SolarOS Rover Game Boy terminal."

[groups]
# PAL scanout owns I2S0, so Game Boy audio remains off. Keep the focused Wi-Fi
# and SSH/SCP client stack while leaving Invaders out of this single-game image.
hardware_shell = true
filesystem = true
wifi = true
bluetooth = true
sd_storage = true
audio_support = true
control_bindings = true
signal_processing = true
vector_math = true
gpio = true
onewire = true
i2c = true
spi = true
uart = true
adc = true
pwm = true
board_buttons = true
adc_dpad = true
logging = true
embedded_docs = true
serial_terminal = true
editor = true
pager = true
files = true
io = true
bridge = true
gpio_keys = true
ps2_keyboard = true
ssh = true
gameboy = true
