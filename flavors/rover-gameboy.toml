[flavor]
name = "rover-gameboy"
description = "Focused SolarOS Rover Game Boy terminal."

[packages]
system = true
expansions = false
maintenance_apps = false
maintenance_jobs = false
hardware_jobs = false
audio = false
net = false
agent = false
media = false
games = true
python = false
lua = false
writing = false
utils = false

# PAL scanout owns I2S0, so Game Boy audio remains off. Keep the focused Wi-Fi
# and SSH/SCP client stack while leaving Invaders out of this single-game image.
service_wifi = true
service_synth = false
core_fs_commands = true
app_docs = true
app_edit = true
app_less = true
app_com = true
app_files = true
app_io = true
app_ssh = true
app_scp = true
app_invaders = false
job_log = true
job_bridge = true
job_gpio_keys = true
job_ps2_keyboard = true
