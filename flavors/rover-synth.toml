[flavor]
name = "rover-synth"
description = "Focused SolarOS Rover synthesizer terminal."

[groups]
# Keep this profile small enough for the classic ESP32 Bluetooth controller
# and PAL scanout. Audio comes from an attached LEDC PWM expansion because
# composite video owns I2S0 on the Rover board.
hardware_shell = true
filesystem = true
bluetooth = true
sd_storage = true
audio_support = true
control_bindings = true
gpio = true
i2c = true
spi = true
uart = true
adc = true
pwm = true
logging = true
embedded_docs = true
serial_terminal = true
editor = true
pager = true
files = true
io = true
gpio_keys = true
ps2_keyboard = true
midi = true
synth = true
audio_pwm = true
