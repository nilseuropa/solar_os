schema_version = 2
type = "library"
id = "hello-library"
name = "Hello Library"
version = "1.1.0"
description = "Resident library with a versioned unsigned addition API."
target = "esp32s3"
native_abi = 1
lifecycle_abi = 1
minimum_host_api_size = 24
required_capabilities = ["psram"]
artifact = "solaros_native_hello_library.library.elf"

[sdk.headers]
"hello_library_api.h" = "main/hello_library_api.h"

[build]
entry = "main"
sources = ["main/hello_library.c"]
include_dirs = ["main"]
