[platformio]
src_dir = main

[env:probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1

[env:differential]
extends = env:probe
board_build.cmake_extra_args = -DSOLAR_CC_DIFFERENTIAL=1
board_build.partitions = differential_partitions.csv

[env:builtin]
extends = env:probe
board_build.cmake_extra_args = -DSOLAR_CC_BUILTIN=1
extra_scripts = post:../../../../scripts/platformio_cc.py
custom_solaros_firmware_project = ../../../..
custom_solaros_builtin_cc = true
