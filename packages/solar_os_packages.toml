  "expansion_audio_pwm",
  "expansion_pcm5102",
  "job_midi",
  "job_pocsag",
  "job_radio_link",
  "job_meshcore",
]

[groups.maintenance_apps]
members = [
  "service_ota",
  "service_docs",
  "service_contacts",
  "service_credentials",
  "service_messaging",
  "service_gateway",
  "core_fs_commands",
  "app_docs",
  "app_inbox",
  "app_contacts",
  "app_chat",
  "app_com",
  "app_edit",
  "app_less",
  "app_io",
