  "service_audio_board",
  "service_audio_codecs",
  "service_synth",
  "app_aplay",
  "app_arecord",
  "app_recorder",
  "app_player",
  "app_synth",
  "app_funcgen",
]
triggers = [
  "app_aplay",
  "app_arecord",
  "app_recorder",
  "app_player",
  "app_synth",
  "app_funcgen",
]

[groups.net]
capabilities = ["wifi"]
members = [
  "service_wifi",
  "service_wireguard",
  "service_espnow",
  "service_net",
  "service_mqtt",
  "service_ssh",
  "service_mail",
  "chat_transport_gateway",
  "service_http_client",
  "service_http_server",
  "app_ssh",
  "app_scp",
  "app_curl",
  "app_webradio",
  "app_telnet",
  "app_web",
  "app_email",
  "job_httpd",
  "job_displayd",
  "job_gateway_sync",
  "job_chatd",
  "job_telnetd",
  "job_email_sync",
  "job_slip",
  "job_ntp_sync",
  "job_espnow_link",
]
