[groups.bootstrap]
immutable = true
members = ["core_runtime", "core_shell"]

[groups.system]
members = [
  "system_shell",
  "service_wifi",
  "service_ble",
  "service_sd",
  "service_audio",
  "service_audio_board",
  "service_streams",
  "service_synth",
  "service_controls",
  "job_controls",
  "service_resources",
  "service_engines",
  "service_vector",
  "service_dsp",
  "service_gpio",
  "service_onewire",
  "service_logic",
  "service_i2c",
  "service_spi",
  "service_json",
  "service_crypto",
  "service_uart",
  "service_battery",
  "service_rtc",
  "service_sensors",
  "service_adc",
  "service_pwm",
  "service_buttons",
  "service_joystick",
  "service_adc_dpad",
]

[groups.expansions]
