  "app_ssh",
  "app_scp",
  "app_curl",
  "app_webradio",
  "app_telnet",
  "app_web",
  "app_email",
  "job_httpd",
  "job_displayd",
  "job_gateway_sync",
  "job_chatd",
  "job_telnetd",
  "job_email_sync",
  "job_slip",
